<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>32문항 MBTI 테스트</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5ff;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1, h2, p {
      text-align: center;
    }

    .question {
      background: #eef1ff;
      margin: 15px 0;
      padding: 18px;
      border-radius: 15px;
    }

    .question b {
      display: block;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .choice {
      background: white;
      border: 1px solid #777;
    }

    .selected {
      background: #667eea;
      color: white;
    }

    #submitBtn {
      display: block;
      margin: 30px auto;
      background: #667eea;
      color: white;
      font-size: 17px;
    }

    #result {
      display: none;
      text-align: center;
      line-height: 1.8;
    }

    .emoji {
      font-size: 80px;
    }

    .result-card {
      background: #eef1ff;
      padding: 25px;
      border-radius: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✨ 재미있는 MBTI 테스트 ✨</h1>
  <p>32개 질문으로 나의 성격 캐릭터를 확인해보자!</p>

  <div id="quiz"></div>

  <button id="submitBtn" onclick="showResult()">결과 확인하기</button>

  <div id="result"></div>
</div>

<script>
  const questions = [
    ["사람들과 함께 있으면 에너지가 생긴다.", "E", "I"],
    ["혼자 있는 시간이 꼭 필요하다.", "I", "E"],
    ["새로운 사람과 쉽게 친해진다.", "E", "I"],
    ["말하기보다 듣는 편이 편하다.", "I", "E"],
    ["모임에서 먼저 말을 꺼내는 편이다.", "E", "I"],
    ["혼자 생각을 정리하는 시간이 좋다.", "I", "E"],
    ["여럿이 같이 활동할 때 힘이 난다.", "E", "I"],
    ["조용한 환경에서 집중이 잘 된다.", "I", "E"],

    ["현실적이고 구체적인 설명이 좋다.", "S", "N"],
    ["상상하고 아이디어를 떠올리는 게 좋다.", "N", "S"],
    ["경험으로 확인된 방법을 선호한다.", "S", "N"],
    ["새로운 가능성을 생각하는 편이다.", "N", "S"],
    ["세부 내용을 꼼꼼히 보는 편이다.", "S", "N"],
    ["전체적인 큰 그림을 먼저 본다.", "N", "S"],
    ["실제로 가능한지가 중요하다.", "S", "N"],
    ["독특하고 창의적인 방식이 좋다.", "N", "S"],

    ["결정할 때 논리와 근거를 우선한다.", "T", "F"],
    ["결정할 때 사람의 감정을 고려한다.", "F", "T"],
    ["틀린 점은 솔직히 말하는 편이다.", "T", "F"],
    ["상대가 상처받지 않게 말하려 한다.", "F", "T"],
    ["문제 해결이 공감보다 먼저라고 생각한다.", "T", "F"],
    ["상대의 마음을 먼저 이해하려 한다.", "F", "T"],
    ["원칙과 기준이 중요하다.", "T", "F"],
    ["관계의 분위기와 조화가 중요하다.", "F", "T"],

    ["계획을 세우고 그대로 실천하는 편이다.", "J", "P"],
    ["상황에 따라 유연하게 움직이는 편이다.", "P", "J"],
    ["마감 전에 미리 끝내야 마음이 편하다.", "J", "P"],
    ["마감 직전에 집중력이 올라간다.", "P", "J"],
    ["일정표나 체크리스트를 좋아한다.", "J", "P"],
    ["즉흥적인 활동도 즐겁다.", "P", "J"],
    ["정리정돈이 되어 있어야 편하다.", "J", "P"],
    ["계획보다 자유로운 흐름이 좋다.", "P", "J"]
  ];

  const resultData = {
    INTJ: ["🧙‍♂️", "전략가", "목표가 뚜렷하고 분석력이 뛰어남", "차갑거나 고집 세게 보일 수 있음"],
    INTP: ["🧪", "아이디어 연구가", "창의적이고 호기심이 많음", "실행이 늦어질 수 있음"],
    ENTJ: ["🦁", "지휘관", "리더십과 추진력이 강함", "너무 강하게 밀어붙일 수 있음"],
    ENTP: ["🦊", "발명가", "재치 있고 도전을 즐김", "쉽게 싫증낼 수 있음"],

    INFJ: ["🌙", "조용한 조언가", "통찰력과 배려심이 깊음", "혼자 고민을 많이 할 수 있음"],
    INFP: ["🌸", "감성적인 몽상가", "상상력이 풍부하고 따뜻함", "현실적인 결정이 어려울 수 있음"],
    ENFJ: ["🌞", "따뜻한 선도자", "사람을 잘 이끌고 공감력이 좋음", "남을 너무 신경 쓸 수 있음"],
    ENFP: ["🎈", "자유로운 에너지볼", "밝고 아이디어가 많음", "집중력이 흔들릴 수 있음"],

    ISTJ: ["📘", "성실한 관리자", "책임감 있고 꼼꼼함", "변화에 적응이 느릴 수 있음"],
    ISFJ: ["🧸", "다정한 수호자", "세심하고 배려심이 많음", "거절을 어려워할 수 있음"],
    ESTJ: ["📢", "현실적인 관리자", "체계적이고 실행력이 좋음", "융통성이 부족해 보일 수 있음"],
    ESFJ: ["🍪", "분위기 메이커", "친절하고 사교성이 좋음", "인정 욕구가 강할 수 있음"],

    ISTP: ["🔧", "만능 해결사", "침착하고 실용적임", "감정 표현이 적을 수 있음"],
    ISFP: ["🎨", "감성 예술가", "섬세하고 자유로움", "계획성이 약할 수 있음"],
    ESTP: ["🏄", "모험가", "행동력이 빠르고 현실 감각이 좋음", "충동적일 수 있음"],
    ESFP: ["🎤", "무대 위 스타", "밝고 활발하며 분위기를 잘 살림", "장기 계획이 약할 수 있음"]
  };

  const quiz = document.getElementById("quiz");
  const answers = new Array(questions.length);

  for (let i = 0; i < questions.length; i++) {
    const box = document.createElement("div");
    box.className = "question";

    box.innerHTML = `
      <b>Q${i + 1}. ${questions[i][0]}</b>
      <button class="choice" onclick="selectAnswer(${i}, '${questions[i][1]}', this)">그렇다</button>
      <button class="choice" onclick="selectAnswer(${i}, '${questions[i][2]}', this)">아니다</button>
    `;

    quiz.appendChild(box);
  }

  function selectAnswer(index, type, button) {
    answers[index] = type;

    const buttons = button.parentElement.querySelectorAll("button");
    buttons.forEach(btn => btn.classList.remove("selected"));

    button.classList.add("selected");
  }

  function showResult() {
    for (let i = 0; i < answers.length; i++) {
      if (!answers[i]) {
        alert("아직 답하지 않은 질문이 있어!");
        return;
      }
    }

    const score = {
      E: 0, I: 0,
      S: 0, N: 0,
      T: 0, F: 0,
      J: 0, P: 0
    };

    answers.forEach(type => {
      score[type]++;
    });

    const mbti =
      (score.E >= score.I ? "E" : "I") +
      (score.S >= score.N ? "S" : "N") +
      (score.T >= score.F ? "T" : "F") +
      (score.J >= score.P ? "J" : "P");

    const data = resultData[mbti];

    quiz.style.display = "none";
    document.getElementById("submitBtn").style.display = "none";

    const result = document.getElementById("result");
    result.style.display = "block";

    result.innerHTML = `
      <div class="result-card">
        <div class="emoji">${data[0]}</div>
        <h2>당신의 MBTI는 ${mbti}!</h2>
        <h3>${data[1]}</h3>
        <p><b>장점:</b> ${data[2]}</p>
        <p><b>단점:</b> ${data[3]}</p>
        <p>
          E/I: ${score.E} : ${score.I}<br>
          S/N: ${score.S} : ${score.N}<br>
          T/F: ${score.T} : ${score.F}<br>
          J/P: ${score.J} : ${score.P}
        </p>
        <button onclick="location.reload()">다시 하기</button>
      </div>
    `;
  }
</script>

</body>
</html>
